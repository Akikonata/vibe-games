<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="macPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBD3D8"/><stop offset="60%" stop-color="#E58B97"/><stop offset="100%" stop-color="#C46270"/>
    </linearGradient>
    <linearGradient id="macGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5F2D6"/><stop offset="60%" stop-color="#A6C98C"/><stop offset="100%" stop-color="#759B5E"/>
    </linearGradient>
  </defs>
  <ellipse cx="80" cy="138" rx="52" ry="10" fill="#5E3015" opacity="0.2"/>
  <!-- 底层开心果马卡龙 -->
  <g transform="translate(12, 54)">
    <rect x="24" y="54" width="96" height="22" rx="11" fill="url(#macGreen)" stroke="#4C6B3B" stroke-width="2.6"/>
    <!-- 奶油夹心 -->
    <rect x="20" y="42" width="104" height="16" rx="8" fill="#FFF8E8" stroke="#8C6A4A" stroke-width="2.2"/>
    <!-- 蕾丝裙边 -->
    <path d="M24 44 Q30 38 36 44 Q42 38 48 44 Q54 38 60 44 Q66 38 72 44 Q78 38 84 44 Q90 38 96 44 Q102 38 108 44 Q114 38 120 44"
          fill="#CBE0B6" stroke="#5E7D4B" stroke-width="2"/>
    <!-- 顶壳 -->
    <path d="M22 40 C22 14, 122 14, 122 40 Z" fill="url(#macGreen)" stroke="#4C6B3B" stroke-width="2.6"/>
    <path d="M40 26 Q66 19 88 23" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
  </g>
  <!-- 顶层微斜覆盆子马卡龙 -->
  <g transform="translate(-8, 12) rotate(-10 80 60)">
    <rect x="28" y="52" width="92" height="20" rx="10" fill="url(#macPink)" stroke="#8A3E4A" stroke-width="2.6"/>
    <rect x="24" y="40" width="100" height="15" rx="7.5" fill="#FCE8EC" stroke="#9C5662" stroke-width="2.2"/>
    <path d="M28 42 Q34 36 40 42 Q46 36 52 42 Q58 36 64 42 Q70 36 76 42 Q82 36 88 42 Q94 36 100 42 Q106 36 112 42 Q118 36 120 42"
          fill="#F4B6BF" stroke="#8A3E4A" stroke-width="2"/>
    <path d="M26 38 C26 12, 122 12, 122 38 Z" fill="url(#macPink)" stroke="#8A3E4A" stroke-width="2.6"/>
    <path d="M44 24 Q68 17 90 21" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- 新鲜覆盆子点缀 -->
  <g transform="translate(114, 46)">
    <circle cx="0" cy="0" r="8" fill="#D1475B" stroke="#75212E" stroke-width="2"/>
    <circle cx="-5" cy="5" r="6" fill="#E05A6D" stroke="#75212E" stroke-width="1.8"/>
    <circle cx="5" cy="5" r="6" fill="#C43B4E" stroke="#75212E" stroke-width="1.8"/>
    <circle cx="-2" cy="-2" r="2" fill="#FFF" opacity="0.7"/>
  </g>

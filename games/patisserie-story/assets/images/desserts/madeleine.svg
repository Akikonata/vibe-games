<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="madBase" cx="42%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#FFF5C8"/>
      <stop offset="45%" stop-color="#F5BE55"/>
      <stop offset="82%" stop-color="#D47E28"/>
      <stop offset="100%" stop-color="#9E4E14"/>

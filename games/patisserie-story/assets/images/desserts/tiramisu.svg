  <polygon points="28,62 82,86 82,128 28,104" fill="#FFF7E6" stroke="#4A2511" stroke-width="3" stroke-linejoin="round"/>
  <!-- 咖啡浸润手指饼干夹层 -->
  <polygon points="28,78 82,102 82,112 28,88" fill="#8C522B"/>
  <polygon points="28,96 82,120 82,128 28,104" fill="#6E3B1E"/>
  <!-- 右侧立面分层（偏暗受光面） -->

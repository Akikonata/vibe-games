<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <ellipse cx="80" cy="136" rx="56" ry="11" fill="#4A210D" opacity="0.22"/>
  <!-- 顶面丝绒可可粉层 -->
  <polygon points="28,62 80,38 134,62 82,86" fill="#63331A" stroke="#3B1A0B" stroke-width="3" stroke-linejoin="round"/>

  <polygon points="82,102 134,78 134,88 82,112" fill="#75411F"/>
  <polygon points="82,120 134,96 134,104 82,128" fill="#592C14"/>
  <!-- 顶面可可粉细密质感与两颗烘焙咖啡豆 -->
  <g fill="#8C4E2B" opacity="0.6">
    <circle cx="60" cy="60" r="2"/><circle cx="74" cy="52" r="1.8"/><circle cx="96" cy="64" r="2"/>
    <circle cx="82" cy="70" r="1.8"/><circle cx="108" cy="60" r="1.6"/>
  </g>
  <g transform="translate(80, 56) rotate(-18)">
    <ellipse cx="0" cy="0" rx="11" ry="7.5" fill="#4A210D" stroke="#291005" stroke-width="2"/>
    <path d="M-8 0 Q0 3 8 0" fill="none" stroke="#9C5E34" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
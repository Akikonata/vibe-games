<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500">
  <defs>
    <linearGradient id="stoneO" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A65E36"/><stop offset="1" stop-color="#6B3418"/></linearGradient>
    <linearGradient id="deckIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A210D"/><stop offset="1" stop-color="#8C3E18"/></linearGradient>
  </defs>
  <rect width="640" height="500" fill="url(#stoneO)"/>
  <!-- 石砌砖缝 -->
  <g stroke="#4E2410" stroke-width="2.5" opacity="0.5">
    <line x1="0" y1="60" x2="640" y2="60"/><line x1="0" y1="120" x2="640" y2="120"/><line x1="0" y1="440" x2="640" y2="440"/>
    <line x1="160" y1="0" x2="160" y2="60"/><line x1="480" y1="0" x2="480" y2="60"/>
  </g>
  <!-- 230°C 高温石板炉膛视窗 -->
  <rect x="26" y="76" width="588" height="352" rx="34" fill="url(#deckIn)" stroke="#DFB06E" stroke-width="6"/>
  <!-- 炉膛顶部加热管红光 -->
  <path d="M56 106 Q320 124 584 106" fill="none" stroke="#FF9B42" stroke-width="8" stroke-linecap="round" opacity="0.72"/>
  <rect x="44" y="388" width="552" height="18" rx="8" fill="#5E3A26" stroke="#2E1308" stroke-width="3"/>
  <!-- 顶部黄铜 230°C 铭牌 -->
  <rect x="220" y="20" width="200" height="38" rx="19" fill="#3B1A0B" stroke="#DFB06E" stroke-width="3"/>
  <text x="320" y="45" text-anchor="middle" fill="#FFD980" font-size="18" font-weight="700" font-family="-apple-system,sans-serif">230°C 石板高温烤炉</text>
</svg>
    <linearGradient id="hairBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78421B"/>
      <stop offset="100%" stop-color="#4B260D"/>
    </linearGradient>
    <linearGradient id="eye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#362010"/>
      <stop offset="48%" stop-color="#754822"/>
      <stop offset="100%" stop-color="#BA7E42"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E08D76" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#E08D76" stop-opacity="0"/>
    </radialGradient>
  </defs>

  
  
  

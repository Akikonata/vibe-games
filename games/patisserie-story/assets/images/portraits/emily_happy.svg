      <stop offset="100%" stop-color="#4A3B54"/>
    </linearGradient>
    <linearGradient id="eye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#322342"/>
      <stop offset="48%" stop-color="#6A5282"/>
      <stop offset="100%" stop-color="#AD94C7"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F09498" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#F09498" stop-opacity="0"/>
    </radialGradient>
  </defs>

  
  
  

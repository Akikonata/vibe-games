<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 680" width="520" height="680">
  <defs>
    
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8E1CC"/>
      <stop offset="75%" stop-color="#E5BF9E"/>
      <stop offset="100%" stop-color="#C99B76"/>
    </linearGradient>
    <linearGradient id="hair" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#BDB4AD"/>
      <stop offset="50%" stop-color="#8A8079"/>
      <stop offset="100%" stop-color="#5B524C"/>
    </linearGradient>
    <linearGradient id="hairBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A8079"/>
      <stop offset="100%" stop-color="#5B524C"/>
    </linearGradient>
    <linearGradient id="eye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#332014"/>
      <stop offset="48%" stop-color="#6B442A"/>
      <stop offset="100%" stop-color="#A6734B"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DC8A74" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#DC8A74" stop-opacity="0"/>
    </radialGradient>
  </defs>

  
  
  
    <path d="M148 214 C138 148, 182 100, 260 100 C338 100, 382 148, 372 214

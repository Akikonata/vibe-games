<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 680" width="520" height="680">
  <defs>
    
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4EA"/>
      <stop offset="75%" stop-color="#F7DEC9"/>
      <stop offset="100%" stop-color="#E5BFA4"/>
    </linearGradient>
    <linearGradient id="hair" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F2EEEA"/>
      <stop offset="50%" stop-color="#CFC8C1"/>
      <stop offset="100%" stop-color="#9C948C"/>
    </linearGradient>
    <linearGradient id="hairBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CFC8C1"/>
      <stop offset="100%" stop-color="#9C948C"/>
    </linearGradient>
    <linearGradient id="eye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2620"/>
      <stop offset="48%" stop-color="#765145"/>
      <stop offset="100%" stop-color="#B58D7D"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EB968E" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#EB968E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  
  
  

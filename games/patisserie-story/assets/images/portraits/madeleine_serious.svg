      <stop offset="100%" stop-color="#9C948C"/>
    </linearGradient>
    <linearGradient id="eye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2620"/>
      <stop offset="48%" stop-color="#765145"/>
      <stop offset="100%" stop-color="#B58D7D"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EB968E" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#EB968E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  
  
  

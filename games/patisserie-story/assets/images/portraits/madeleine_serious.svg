<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 680" width="520" height="680">
  <defs>
    
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4EA"/>
      <stop offset="75%" stop-color="#F7DEC9"/>
      <stop offset="100%" stop-color="#E5BFA4"/>
    </linearGradient>
    <linearGradient id="hair" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F2EEEA"/>
      <stop offset="50%" stop-color="#CFC8C1"/>

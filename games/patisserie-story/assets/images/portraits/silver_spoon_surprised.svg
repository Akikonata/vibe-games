<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 680" width="520" height="680">
  <defs>
    
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8F0EA"/>
      <stop offset="75%" stop-color="#E6D6CB"/>
      <stop offset="100%" stop-color="#CDB8AA"/>
    </linearGradient>
    <linearGradient id="hair" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#D4DCE4"/>
      <stop offset="50%" stop-color="#9BA7B5"/>
      <stop offset="100%" stop-color="#636E7C"/>
    </linearGradient>
    <linearGradient id="hairBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9BA7B5"/>
      <stop offset="100%" stop-color="#636E7C"/>
    </linearGradient>
    <linearGradient id="eye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2430"/>
      <stop offset="48%" stop-color="#475B73"/>
      <stop offset="100%" stop-color="#8DA6C2"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D99A96" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#D99A96" stop-opacity="0"/>
    </radialGradient>
  </defs>

  
  
  

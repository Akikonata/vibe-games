<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 680" width="520" height="680">
  <defs>
    
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2E6"/>
      <stop offset="75%" stop-color="#F5D7C0"/>
      <stop offset="100%" stop-color="#DFB597"/>
    </linearGradient>
    <linearGradient id="hair" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#744D3B"/>
      <stop offset="50%" stop-color="#4F3123"/>
      <stop offset="100%" stop-color="#2E1A11"/>
    </linearGradient>
    <linearGradient id="hairBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F3123"/>
      <stop offset="100%" stop-color="#2E1A11"/>
    </linearGradient>
    <linearGradient id="eye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2B3A"/>
      <stop offset="48%" stop-color="#3B5E7A"/>
      <stop offset="100%" stop-color="#6D9BC0"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E69586" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#E69586" stop-opacity="0"/>
    </radialGradient>
  </defs>

  
  
  

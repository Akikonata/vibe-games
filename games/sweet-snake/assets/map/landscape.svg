            d="M 110 1325
               C 160 1315, 295 1295, 310 1235
               C 325 1175, 130 1165, 115 1105
               C 100 1045, 295 1035, 305 975
               C 315 915, 165 895, 155 835
               C 145 775, 315 765, 315 705

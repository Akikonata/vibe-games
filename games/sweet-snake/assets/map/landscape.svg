            <ellipse cx="0" cy="94" rx="88" ry="18" fill="#7FB86E" opacity="0.35"/>
            <!-- Trunk & branches -->
            <path d="M-24 92 C-16 58 -15 24 -22 -14 C-38 -28 -55 -35 -68 -48 L-52 -56 C-38 -44 -26 -37 -14 -28 L-8 -58 L12 -58 L16 -24 C30 -36 46 -44 60 -52 L68 -40 C50 -30 34 -20 22 -4 C16 26 18 62 30 92 Z" fill="url(#trunkGrad)" stroke="#7A4434" stroke-width="2.6" stroke-linejoin="round"/>
            <!-- Lush leafy pink-and-green blossom crown -->
            <circle cx="-68" cy="-42" r="46" fill="url(#canopyGreen)" stroke="#629D54" stroke-width="2.4"/>
            <circle cx="68" cy="-38" r="46" fill="url(#canopyGreen)" stroke="#629D54" stroke-width="2.4"/>
            <circle cx="-44" cy="-86" r="50" fill="url(#canopyPink)" stroke="#C65C8A" stroke-width="2.4"/>
            <circle cx="46" cy="-84" r="50" fill="url(#canopyPink)" stroke="#C65C8A" stroke-width="2.4"/>
            <circle cx="0" cy="-108" r="56" fill="url(#canopyPink)" stroke="#C65C8A" stroke-width="2.4"/>
            <circle cx="0" cy="-54" r="48" fill="url(#canopyGreen)" stroke="#629D54" stroke-width="2.2"/>
            <!-- Hanging cute peaches & strawberries -->

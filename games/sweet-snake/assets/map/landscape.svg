            <path d="M-9 20 L-7 2 L7 2 L9 20 Z" fill="#FFF5EA" stroke="#8C4866" stroke-width="2"/>
            <path d="M-22 4 C-22 -14 22 -14 22 4 Z" fill="#FF84B2" stroke="#6B2846" stroke-width="2.2"/>
            <circle cx="-8" cy="-4" r="3.5" fill="#FFF"/>
            <circle cx="7" cy="-6" r="4" fill="#FFF"/>
            <circle cx="1" cy="1" r="2.2" fill="#FFF"/>

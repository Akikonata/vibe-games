              <path d="M-46 -88 c4-5 9-3 8 2" fill="#7CD46A" stroke="#4D8A41" stroke-width="1.4"/>
              <circle cx="-49" cy="-81" r="2.6" fill="#FFD1DE"/>

              <circle cx="52" cy="-72" r="10" fill="#FF8C8C" stroke="#6B2846" stroke-width="1.8"/>
              <path d="M52 -82 c4-5 9-3 8 2" fill="#7CD46A" stroke="#4D8A41" stroke-width="1.4"/>
              <circle cx="49" cy="-75" r="2.6" fill="#FFD9D9"/>

              <circle cx="8" cy="-112" r="9.5" fill="#FF6B99" stroke="#6B2846" stroke-width="1.8"/>
              <circle cx="5" cy="-115" r="2.4" fill="#FFD1DE"/>

              <circle cx="-72" cy="-36" r="8.5" fill="#FF7A9C" stroke="#6B2846" stroke-width="1.8"/>
              <circle cx="72" cy="-30" r="8.5" fill="#FF7A9C" stroke="#6B2846" stroke-width="1.8"/>
            </g>
            <!-- Cute flowers on canopy -->

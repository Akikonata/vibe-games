              <circle cx="10" cy="5" r="10" fill="#FFC2DB" stroke="#D16D98" stroke-width="1.8"/>
              <circle cx="0" cy="-2" r="13" fill="#FFD9E9" stroke="#D16D98" stroke-width="1.8"/>
            </g>

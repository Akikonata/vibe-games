            <circle cx="-5" cy="-4" r="1.6" fill="#FFE680"/>
            <circle cx="6" cy="-2" r="1.6" fill="#FFE680"/>
            <circle cx="0" cy="6" r="1.6" fill="#FFE680"/>
            <circle cx="-6" cy="9" r="1.4" fill="#FFE680"/>
            <circle cx="5" cy="11" r="1.4" fill="#FFE680"/>

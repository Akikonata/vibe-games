              <circle cx="10" cy="5" r="11" fill="#FFC2DB" stroke="#D16D98" stroke-width="1.8"/>
              <circle cx="0" cy="-2" r="14" fill="#FFD9E9" stroke="#D16D98" stroke-width="1.8"/>
            </g>
            <g transform="translate(358, 385)">

              <circle cx="0" cy="-2" r="16" fill="#A6E392" stroke="#57964A" stroke-width="1.8"/>
              <circle cx="-5" cy="-3" r="4" fill="#FF8AB7"/><circle cx="7" cy="4" r="3.5" fill="#FFE26A"/>
            </g>
            <g transform="translate(68, 435)">

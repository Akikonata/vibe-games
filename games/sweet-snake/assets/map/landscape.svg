            <circle cx="330" cy="1080" r="4.5"/><circle cx="330" cy="1080" r="1.8" fill="#FFD447" stroke="none"/>
            <circle cx="120" cy="915" r="4"/><circle cx="120" cy="915" r="1.6" fill="#FFD447" stroke="none"/>
            <circle cx="315" cy="760" r="4.5"/><circle cx="315" cy="760" r="1.8" fill="#FFD447" stroke="none"/>
            <circle cx="105" cy="560" r="4"/><circle cx="105" cy="560" r="1.6" fill="#FFD447" stroke="none"/>
            <circle cx="348" cy="495" r="4.5"/><circle cx="348" cy="495" r="1.8" fill="#FFD447" stroke="none"/>

              <circle cx="-18" cy="-96" r="5.5"/><circle cx="-18" cy="-96" r="2" fill="#FFD447" stroke="none"/>
              <circle cx="28" cy="-92" r="5.5"/><circle cx="28" cy="-92" r="2" fill="#FFD447" stroke="none"/>
              <circle cx="-20" cy="-46" r="5"/><circle cx="-20" cy="-46" r="1.8" fill="#FFD447" stroke="none"/>
              <circle cx="26" cy="-48" r="5"/><circle cx="26" cy="-48" r="1.8" fill="#FFD447" stroke="none"/>
            </g>

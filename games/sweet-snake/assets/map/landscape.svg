<svg class="map-bg-svg" viewBox="0 0 430 1460" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Sky to Meadow vertical gradient -->
            <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FFB9D8"/>
              <stop offset="18%" stop-color="#FFD8EA"/>
              <stop offset="36%" stop-color="#FFEAF2"/>
              <stop offset="56%" stop-color="#E7F6D5"/>
              <stop offset="100%" stop-color="#CBEBB9"/>
            </linearGradient>

            <!-- Soft hills -->
            <linearGradient id="hillPink" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FFD1E4"/>
              <stop offset="100%" stop-color="#F6B0CE"/>
            </linearGradient>
            <linearGradient id="hillPeach" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#E2F4C8"/>
              <stop offset="100%" stop-color="#BCE4A8"/>
            </linearGradient>
            <linearGradient id="hillMint" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#D4F0BA"/>
              <stop offset="100%" stop-color="#A8DA92"/>
            </linearGradient>
            <linearGradient id="hillDeep" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#C6E9AA"/>
              <stop offset="100%" stop-color="#9BD384"/>
            </linearGradient>

            <!-- Strawberry Milk Creek -->
            <linearGradient id="creekGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#B5EEFF"/>
              <stop offset="50%" stop-color="#E2F8FF"/>
              <stop offset="100%" stop-color="#A5E4FA"/>
            </linearGradient>

            <!-- Winding Cream Road -->
            <linearGradient id="roadBase" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FFF4EC"/>
              <stop offset="100%" stop-color="#FFE3D6"/>
            </linearGradient>
            <linearGradient id="roadUnlocked" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#FF7AA8"/>
              <stop offset="100%" stop-color="#FFB75E"/>
            </linearGradient>

            <!-- Tree canopy -->
            <radialGradient id="canopyPink" cx="40%" cy="30%" r="65%">
              <stop offset="0%" stop-color="#FFE1EE"/>
              <stop offset="55%" stop-color="#FFA6CA"/>
              <stop offset="100%" stop-color="#EE7AA9"/>
            </radialGradient>
            <radialGradient id="canopyGreen" cx="38%" cy="30%" r="65%">
              <stop offset="0%" stop-color="#DDF7B8"/>
              <stop offset="60%" stop-color="#9EDB82"/>
              <stop offset="100%" stop-color="#76BF62"/>
            </radialGradient>
            <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#B6765D"/>
              <stop offset="50%" stop-color="#D7997E"/>
              <stop offset="100%" stop-color="#9D5E48"/>
            </linearGradient>

            <!-- Cloud gradient -->
            <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="100%" stop-color="#FFE8F2"/>
            </linearGradient>
            <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
              <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#7C3253" flood-opacity="0.16"/>
            </filter>
          </defs>

          <!-- Base backdrop -->
          <rect width="430" height="1460" fill="url(#skyGrad)"/>

          <!-- ================= TOP CLOUD KINGDOM (COMING SOON) ================= -->
          <!-- Rainbow Candy Arch -->
          <path d="M 75 215 A 140 120 0 0 1 355 215" fill="none" stroke="#FF92BC" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
          <path d="M 89 215 A 126 108 0 0 1 341 215" fill="none" stroke="#FFE17D" stroke-width="12" stroke-linecap="round" opacity="0.62"/>
          <path d="M 101 215 A 114 96 0 0 1 329 215" fill="none" stroke="#B7F1FF" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

          <!-- Twinkling sky stars -->
          <g fill="#FFFDF0">
            <path class="twinkle" d="M52 130 l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
            <path class="twinkle-delay" d="M376 118 l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z"/>
            <path class="twinkle" d="M350 230 l2 5.5 5.5 2-5.5 2-2 5.5-2-5.5-5.5-2 5.5-2z"/>
            <path class="twinkle-delay" d="M74 265 l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/>
          </g>

          <!-- Floating Dreamy Cloud Castle Island -->
          <g class="cloud-drift-1" filter="url(#softShadow)">
            <!-- Castle towers behind cloud -->
            <rect x="176" y="138" width="24" height="48" rx="6" fill="#FFCCE0" stroke="#9C4268" stroke-width="2.2"/>
            <polygon points="172,140 188,112 204,140" fill="#FF79AB" stroke="#9C4268" stroke-width="2.2" stroke-linejoin="round"/>
            <rect x="230" y="138" width="24" height="48" rx="6" fill="#FFCCE0" stroke="#9C4268" stroke-width="2.2"/>
            <polygon points="226,140 242,112 258,140" fill="#FF79AB" stroke="#9C4268" stroke-width="2.2" stroke-linejoin="round"/>
            <rect x="195" y="124" width="40" height="62" rx="8" fill="#FFF3F8" stroke="#9C4268" stroke-width="2.4"/>
            <polygon points="189,126 215,92 241,126" fill="#FFD452" stroke="#9C4268" stroke-width="2.4" stroke-linejoin="round"/>
            <!-- Heart gate -->
            <path d="M215 154 c-5-6-13-1-13 5 0 7 13 14 13 14s13-7 13-14c0-6-8-11-13-5z" fill="#FF6B9E"/>
            <!-- Fluffy cloud cushion -->
            <path d="M108 214 C96 214 88 203 92 191 C95 181 106 176 116 179 C123 166 139 160 153 166 C163 156 181 154 195 164 C208 153 230 154 242 166 C257 159 276 165 284 179 C297 177 310 185 313 197 C316 208 307 218 295 218 L112 218 Z" fill="url(#cloudGrad)" stroke="#E397B8" stroke-width="2.2"/>
            <!-- Coming soon pill on cloud -->
            <rect x="135" y="182" width="160" height="27" rx="13.5" fill="#FFF7FB" stroke="#D1749B" stroke-width="1.8"/>
            
          </g>

          <!-- Background Fluffy Clouds -->
          <g class="cloud-drift-2" opacity="0.88">
            <path d="M12 292 C4 292 0 282 6 276 C12 270 21 271 26 274 C31 265 44 264 52 271 C60 269 70 274 71 283 C72 290 66 295 58 295 L14 295 Z" fill="#FFF9FC"/>
            <path d="M352 278 C345 278 341 269 346 263 C351 258 359 258 364 261 C369 253 381 252 389 259 C397 257 406 262 407 270 C408 276 402 281 395 281 L354 281 Z" fill="#FFF9FC"/>
          </g>

          <!-- ================= LAYERED ROLLING HILLS ================= -->
          <!-- Pink blossom ridge -->
          <path d="M0 328 Q105 275 220 315 T430 302 L430 560 L0 560 Z" fill="url(#hillPink)"/>
          <!-- Soft sunlit meadow hill -->
          <path d="M0 448 Q125 390 250 432 T430 412 L430 820 L0 820 Z" fill="url(#hillPeach)"/>
          <!-- Mid green hill -->
          <path d="M0 735 Q140 675 275 724 T430 700 L430 1120 L0 1120 Z" fill="url(#hillMint)"/>
          <!-- Foreground lush hill -->
          <path d="M0 1070 Q135 1015 265 1068 T430 1040 L430 1460 L0 1460 Z" fill="url(#hillDeep)"/>

          <!-- ================= SPARKLING MILK-BLUE CREEK & BRIDGE ================= -->
          <path d="M-10 818 C95 790 170 860 265 845 C340 832 395 796 440 812 L440 864 C385 848 335 884 260 896 C165 910 88 844 -10 868 Z" fill="url(#creekGrad)" stroke="#8DD8F0" stroke-width="2.5"/>
          <!-- Water sparkles -->
          <path d="M42 838 Q62 832 82 838" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
          <path d="M325 848 Q348 840 370 848" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
          <circle cx="110" cy="852" r="3" fill="#FFF" opacity="0.85"/>
          <circle cx="388" cy="832" r="2.5" fill="#FFF" opacity="0.85"/>

